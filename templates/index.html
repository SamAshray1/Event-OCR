<!DOCTYPE html>
<html>
<head>
    <title>AI Event Recognition</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
            background: #f5f5f5;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 700px;
            margin: auto;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        img {
            margin-top: 20px;
            max-width: 100%;
        }

        pre {
            background: #eee;
            padding: 10px;
            overflow-x: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📅 AI Event Recognition</h1>

    <form id="uploadForm">
        <input type="file" id="fileInput" accept="image/*" required />
        <button type="submit">Upload Poster</button>
    </form>

    <img id="preview" />

    <h2>Extracted Event</h2>

    <pre id="result"></pre>

    <a id="calendarLink" target="_blank"></a>
</div>

<script>

const form = document.getElementById("uploadForm");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const fileInput = document.getElementById("fileInput");

    const file = fileInput.files[0];

    if (!file) return;

    // Preview image
    const preview = document.getElementById("preview");
    preview.src = URL.createObjectURL(file);

    const formData = new FormData();

    formData.append("file", file);

    document.getElementById("result").innerText = "Processing...";

    const response = await fetch("/upload", {
        method: "POST",
        body: formData
    });

    const data = await response.json();

    document.getElementById("result").innerText =
        JSON.stringify(data.event, null, 2);

    const link = document.getElementById("calendarLink");

    link.href = data.calendar_link;

    link.innerText = "📅 Add to Google Calendar";
});

</script>

</body>
</html>
