<!DOCTYPE html>
<html>
<head>
    <title>VLM Event Extractor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 20px; }
        #canvas-container { position: relative; border: 2px dashed #ccc; display: inline-block; cursor: crosshair; }
        canvas { display: block; max-width: 100%; height: auto; }
        .controls { margin: 20px 0; display: flex; gap: 10px; align-items: center; }
        #result-box { background: #f9f9f9; border-left: 5px solid #007bff; padding: 15px; display: none; margin-top: 20px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 2s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h2>Multimodal VLM Event Extractor</h2>
    <p>Upload a poster. You can extract everything automatically or draw a box for specific details.</p>

    <input type="file" id="imageLoader" accept="image/*">
    
    <div class="controls">
        <button id="btn-full" onclick="processVLM(false)">Auto-Extract Full Page</button>
        <button id="btn-crop" onclick="processVLM(true)">Extract from Drawn Box</button>
        <div id="loader" class="loader"></div>
    </div>

    <div id="canvas-container">
        <canvas id="imageCanvas"></canvas>
    </div>

    <div id="result-box">
        <h3>Vision Model Analysis:</h3>
        <div id="raw-output" style="white-space: pre-wrap;"></div>
    </div>

    <script>
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        let img = new Image();
        let startX, startY, isDrawing = false, rect = {};

        // Image Preview Logic
        document.getElementById('imageLoader').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        // Drawing Logic
        canvas.onmousedown = (e) => {
            const r = canvas.getBoundingClientRect();
            startX = (e.clientX - r.left) * (canvas.width / r.width);
            startY = (e.clientY - r.top) * (canvas.height / r.height);
            isDrawing = true;
        };
        canvas.onmousemove = (e) => {
            if (!isDrawing) return;
            const r = canvas.getBoundingClientRect();
            const currX = (e.clientX - r.left) * (canvas.width / r.width);
            const currY = (e.clientY - r.top) * (canvas.height / r.height);
            ctx.drawImage(img, 0, 0);
            ctx.strokeStyle = "#007bff";
            ctx.lineWidth = 5;
            ctx.strokeRect(startX, startY, currX - startX, currY - startY);
        };
        canvas.onmouseup = (e) => {
            isDrawing = false;
            const r = canvas.getBoundingClientRect();
            const endX = (e.clientX - r.left) * (canvas.width / r.width);
            const endY = (e.clientY - r.top) * (canvas.height / r.height);
            rect = { x: startX, y: startY, w: endX - startX, h: endY - startY };
        };

        // API Call
        async function processVLM(useCrop) {
            const fileInput = document.getElementById('imageLoader');
            if (!fileInput.files[0]) return alert("Please upload an image first.");
            
            document.getElementById('loader').style.display = "block";
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            if (useCrop) formData.append("box", JSON.stringify(rect));

            try {
                const response = await fetch('/vlm/process', { method: 'POST', body: formData });
                const data = await response.json();
                document.getElementById('result-box').style.display = "block";
                document.getElementById('raw-output').innerText = data.google_calendar_link;
            } catch (err) {
                alert("Error connecting to VLM service.");
            } finally {
                document.getElementById('loader').style.display = "none";
            }
        }
    </script>
</body>
</html>
